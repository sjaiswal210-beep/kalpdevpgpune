<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="#F5F3FF"/>
  <!-- Header -->
  <rect width="1080" height="140" fill="#ffffff"/>
  <rect x="60" y="45" width="50" height="50" rx="12" fill="#7C3AED"/>
  <text x="130" y="70" font-family="Poppins, Arial" font-size="30" font-weight="700" fill="#1F2937">KalpDev PG</text>
  <text x="130" y="105" font-family="Poppins, Arial" font-size="22" fill="#9CA3AF">Tenant Portal</text>

  <!-- Welcome card -->
  <rect x="60" y="190" width="960" height="360" rx="40" fill="url(#hero)"/>
