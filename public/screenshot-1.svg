  <rect x="60" y="1340" width="960" height="440" rx="32" fill="#ffffff" stroke="#FECACA" stroke-width="3"/>
  <text x="110" y="1420" font-family="Poppins, Arial" font-size="32" font-weight="700" fill="#1F2937">Rent Due — June 2026</text>
  <text x="850" y="1420" font-family="Poppins, Arial" font-size="40" font-weight="800" fill="#DC2626" text-anchor="middle">₹3,500</text>
  <rect x="110" y="1470" width="860" height="90" rx="20" fill="#F5F3FF"/>
  <text x="140" y="1525" font-family="monospace" font-size="30" fill="#4B5563">9834573544@ybl</text>
  <rect x="110" y="1590" width="410" height="90" rx="20" fill="#ffffff" stroke="#93C5FD" stroke-width="2"/>
  <text x="315" y="1645" font-family="Poppins, Arial" font-size="28" font-weight="600" fill="#1D4ED8" text-anchor="middle">💙 GPay</text>
  <rect x="560" y="1590" width="410" height="90" rx="20" fill="#ffffff" stroke="#D8B4FE" stroke-width="2"/>
  <text x="765" y="1645" font-family="Poppins, Arial" font-size="28" font-weight="600" fill="#7C3AED" text-anchor="middle">💜 PhonePe</text>
</svg>
