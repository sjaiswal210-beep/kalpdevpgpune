  <text x="110" y="1160" font-family="Poppins, Arial" font-size="28" font-weight="700" fill="#EA580C">Amazon Cashback</text>
  <text x="110" y="1210" font-family="Poppins, Arial" font-size="24" fill="#78716C">Buy anything &amp; earn cashback points</text>
  <rect x="110" y="1230" width="260" height="70" rx="18" fill="#F97316"/>
  <text x="240" y="1275" font-family="Poppins, Arial" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Open Amazon</text>

