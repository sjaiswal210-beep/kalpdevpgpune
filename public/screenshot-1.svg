  <rect x="60" y="720" width="960" height="240" rx="32" fill="url(#hero)"/>
  <text x="110" y="800" font-family="Poppins, Arial" font-size="32" font-weight="600" fill="#ffffff">🎁 My Rewards</text>
  <text x="110" y="880" font-family="Poppins, Arial" font-size="70" font-weight="800" fill="#ffffff">120 pts</text>
  <text x="110" y="925" font-family="Poppins, Arial" font-size="24" fill="#E9D5FF">= ₹120 rent discount available</text>

  <!-- Shop earn -->
