  <text x="235" y="290" font-family="Poppins, Arial" font-size="42" font-weight="700" fill="#ffffff">Welcome, Priya!</text>
  <text x="235" y="340" font-family="Poppins, Arial" font-size="28" fill="#E9D5FF">Room 201 • Bed A</text>
  <!-- stat boxes -->
  <rect x="110" y="400" width="200" height="110" rx="20" fill="#ffffff" opacity="0.15"/>
  <text x="210" y="450" font-family="Poppins, Arial" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">₹3,500</text>
  <text x="210" y="485" font-family="Poppins, Arial" font-size="20" fill="#E9D5FF" text-anchor="middle">Monthly Rent</text>
  <rect x="330" y="400" width="200" height="110" rx="20" fill="#ffffff" opacity="0.15"/>
  <text x="430" y="450" font-family="Poppins, Arial" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">201</text>
  <text x="430" y="485" font-family="Poppins, Arial" font-size="20" fill="#E9D5FF" text-anchor="middle">Room No.</text>
  <rect x="550" y="400" width="200" height="110" rx="20" fill="#ffffff" opacity="0.15"/>
  <text x="650" y="450" font-family="Poppins, Arial" font-size="34" font-weight="700" fill="#86EFAC" text-anchor="middle">Paid</text>
  <text x="650" y="485" font-family="Poppins, Arial" font-size="20" fill="#E9D5FF" text-anchor="middle">This Month</text>
  <rect x="770" y="400" width="200" height="110" rx="20" fill="#ffffff" opacity="0.15"/>
  <text x="870" y="450" font-family="Poppins, Arial" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">Bed A</text>
  <text x="870" y="485" font-family="Poppins, Arial" font-size="20" fill="#E9D5FF" text-anchor="middle">Assigned</text>

  <!-- Tabs -->
  <rect x="60" y="600" width="240" height="80" rx="24" fill="#7C3AED"/>
  <text x="180" y="650" font-family="Poppins, Arial" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">🎁 Rewards</text>
  <rect x="320" y="600" width="240" height="80" rx="24" fill="#ffffff"/>
  <text x="440" y="650" font-family="Poppins, Arial" font-size="26" fill="#6B7280" text-anchor="middle">Rent History</text>
